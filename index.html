<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXI Trust Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #4a9eff;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .stats {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
        }

        .stat-value {
            color: #4a9eff;
            font-size: 1.5em;
            font-weight: bold;
        }

        button {
            background: #2a2a2a;
            color: #e0e0e0;
            border: 2px solid #444;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        button:hover {
            background: #3a3a3a;
            border-color: #4a9eff;
        }

        button.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: #1a1a1a;
        }

        .trust-table {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #333;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #4a9eff;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        th:hover {
            background: #3a3a3a;
        }

        th::after {
            content: ' ⇅';
            color: #666;
            font-size: 0.8em;
        }

        th.sort-asc::after {
            content: ' ↑';
            color: #4a9eff;
        }

        th.sort-desc::after {
            content: ' ↓';
            color: #4a9eff;
        }

        td {
            padding: 12px 15px;
            border-top: 1px solid #333;
        }

        tr:hover {
            background: #333;
        }

        tr.checked {
            background: rgba(74, 158, 255, 0.1);
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4a9eff;
        }

        .type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .type-tank { background: #ff6b6b; color: #fff; }
        .type-healer { background: #51cf66; color: #fff; }
        .type-support { background: #4a9eff; color: #fff; }
        .type-melee { background: #ffa94d; color: #fff; }
        .type-caster { background: #9775fa; color: #fff; }
        .type-ranged { background: #20c997; color: #fff; }
        .type-special { background: #e599f7; color: #fff; }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            button {
                width: 100%;
            }

            th, td {
                padding: 10px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 FFXI Trust Tracker</h1>
        <p class="subtitle">Track your collected FFXI Trusts</p>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Collected</span>
                <span class="stat-value" id="collected-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Total</span>
                <span class="stat-value" id="total-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Progress</span>
                <span class="stat-value" id="progress-percent">0%</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="clearAll()">Clear All</button>
            <button onclick="checkAll()">Check All</button>
            <div class="filter-group">
                <button onclick="filterType('all')" class="active" id="filter-all">All</button>
                <button onclick="filterType('tank')" id="filter-tank">Tank</button>
                <button onclick="filterType('melee')" id="filter-melee">Melee</button>
                <button onclick="filterType('ranged')" id="filter-ranged">Ranged</button>
                <button onclick="filterType('caster')" id="filter-caster">Caster</button>
                <button onclick="filterType('healer')" id="filter-healer">Healer</button>
                <button onclick="filterType('support')" id="filter-support">Support</button>
                <button onclick="filterType('special')" id="filter-special">Special</button>
            </div>
        </div>

        <div class="trust-table">
            <table id="trust-table">
                <thead>
                    <tr>
                        <th style="width: 60px;">Done</th>
                        <th onclick="sortTable('name')" data-column="name">Name</th>
                        <th onclick="sortTable('type')" data-column="type">Type</th>
                    </tr>
                </thead>
                <tbody id="trust-tbody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let trusts = [];
        let currentSort = { column: 'name', direction: 'asc' };
        let currentFilter = 'all';
        let checkedTrusts = new Set();

        async function init() {
            try {
                const response = await fetch('trusts.json');
                if (!response.ok) {
                    throw new Error(`Failed to load trusts: ${response.status}`);
                }
                trusts = await response.json();
                loadCheckedState();
                renderTable();
                updateStats();
            } catch (error) {
                console.error('Error loading trusts:', error);
                alert('Failed to load trusts data. Please refresh the page.');
            }
        }

        function loadCheckedState() {
            const saved = localStorage.getItem('ffxi-trusts-checked');
            if (saved) {
                checkedTrusts = new Set(JSON.parse(saved));
            }
        }

        function saveCheckedState() {
            localStorage.setItem('ffxi-trusts-checked', JSON.stringify([...checkedTrusts]));
        }

        let lastFilteredTrusts = [];

        function renderTable() {
            const tbody = document.getElementById('trust-tbody');
            const filteredTrusts = currentFilter === 'all' 
                ? trusts 
                : trusts.filter(t => t.type === currentFilter);

            const sortedTrusts = [...filteredTrusts].sort((a, b) => {
                const aVal = a[currentSort.column];
                const bVal = b[currentSort.column];
                if (!aVal && !bVal) return 0;
                if (!aVal) return 1;
                if (!bVal) return -1;
                const compare = String(aVal).localeCompare(String(bVal));
                return currentSort.direction === 'asc' ? compare : -compare;
            });

            lastFilteredTrusts = sortedTrusts;

            tbody.innerHTML = sortedTrusts.map((trust, index) => {
                const checked = checkedTrusts.has(trust.name);
                const typeLabels = {
                    'tank': 'Tank',
                    'melee': 'Melee',
                    'ranged': 'Ranged',
                    'caster': 'Caster',
                    'healer': 'Healer',
                    'support': 'Support',
                    'special': 'Special'
                };
                return `
                    <tr class="${checked ? 'checked' : ''}" data-type="${trust.type}">
                        <td><input type="checkbox" ${checked ? 'checked' : ''} data-trust-index="${index}" onchange="toggleTrustByIndex(${index})"></td>
                        <td>${trust.name}</td>
                        <td><span class="type-badge type-${trust.type}">${typeLabels[trust.type]}</span></td>
                    </tr>
                `;
            }).join('');

            updateSortIndicators();
        }

        function updateSortIndicators() {
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
            });
            
            const headers = document.querySelectorAll('th[data-column]');
            headers.forEach(th => {
                const column = th.getAttribute('data-column');
                if (column === currentSort.column) {
                    th.classList.add(`sort-${currentSort.direction}`);
                }
            });
        }

        function sortTable(column) {
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'asc';
            }
            renderTable();
        }

        function toggleTrustByIndex(index) {
            const trust = lastFilteredTrusts[index];
            if (!trust) return;
            
            if (checkedTrusts.has(trust.name)) {
                checkedTrusts.delete(trust.name);
            } else {
                checkedTrusts.add(trust.name);
            }
            saveCheckedState();
            renderTable();
            updateStats();
        }

        function updateStats() {
            const total = trusts.length;
            const collected = checkedTrusts.size;
            const progress = total > 0 ? Math.round((collected / total) * 100) : 0;

            document.getElementById('collected-count').textContent = collected;
            document.getElementById('total-count').textContent = total;
            document.getElementById('progress-percent').textContent = progress + '%';
        }

        function clearAll() {
            if (confirm('Are you sure you want to clear all checkboxes?')) {
                checkedTrusts.clear();
                saveCheckedState();
                renderTable();
                updateStats();
            }
        }

        function checkAll() {
            trusts.forEach(trust => checkedTrusts.add(trust.name));
            saveCheckedState();
            renderTable();
            updateStats();
        }

        function filterType(type) {
            currentFilter = type;
            
            document.querySelectorAll('.filter-group button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`filter-${type}`).classList.add('active');
            
            renderTable();
        }

        init();
    </script>
</body>
</html>
